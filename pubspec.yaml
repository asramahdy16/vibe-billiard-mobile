name: vibe_billiard_mobile
description: "Vibe Billiard - Mobile Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # HTTP Client
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure Storage
  flutter_secure_storage: ^9.2.3

  # UI/UX
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utility
  intl: ^0.19.0
  connectivity_plus: ^6.1.1

  # Animations
  flutter_animate: ^4.5.2

  # Shared Preferences (onboarding flag)
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
